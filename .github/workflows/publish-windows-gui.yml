name: Publish Windows GUI
on:
  push:
    branches: [main]
    paths: ['.github/workflows/publish-windows-gui.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          architecture: x64
      - name: Build executable
        shell: pwsh
        run: |
          python -m pip install pyinstaller==6.22.3 requests==2.34.2
          Copy-Item autologin-windows.py windows-gui/windows_autologin.py
          python -m PyInstaller --onefile --windowed --name FortiGate-Autologin windows-gui/windows_gui.py
      - name: Publish release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create windows-gui-v4 dist/FortiGate-Autologin.exe --target $env:GITHUB_SHA --title "Fortigate Login for Windows v4" --latest --notes "Confirms when the background task is running after Save and Start."
